services:

  frontend:
    build: 
      context: ./frontend/docker
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  backend:
    build: 
      context: ./backend/docker
      dockerfile: Dockerfile
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: helloapp
      MYSQL_USER: hello
      MYSQL_PASSWORD: hellopassword
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysql", "-h", "localhost", "-uhello", "-phellopassword", "-e", "SELECT 1"]
      interval: 5s
      timeout: 6s
      retries: 5

volumes:
  mysql_data:
  frontend_node_modules:
  backend_venv: